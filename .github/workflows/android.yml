name: Build Arnis Android APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-android:
    runs-on: ubuntu-24.04
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: |
          sdkmanager "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0" \
            "ndk;27.2.12479018"
          yes | sdkmanager --licenses >/dev/null || true

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "."

      - name: Install Tauri CLI
        run: cargo install tauri-cli --version "^2" --locked

      - name: Prepare Android project
        run: |
          rm -rf gen/android
          ./scripts/prepare-android.sh

      - name: Build ARM64 APK
        run: cargo tauri android build --apk --target aarch64

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: arnis-android-arm64-apk
          path: gen/android/app/build/outputs/apk/**/*.apk
          if-no-files-found: error
          retention-days: 14
