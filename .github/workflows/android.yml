name: Build Arnis Android APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Download Arnis source package
        run: |
          mkdir -p source
          curl -L "https://github.com/Ht600/arnis-android/raw/main/arnis-3.0.0-android-final.zip" -o source/arnis.zip

      - name: Extract source
        run: |
          unzip -q source/arnis.zip -d source/extracted
          cd source/extracted
          if [ -d "arnis-3.0.0-android-final" ]; then
            shopt -s dotglob
            mv arnis-3.0.0-android-final/* .
            rmdir arnis-3.0.0-android-final
          fi

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK packages
        run: |
          sdkmanager "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0" \
            "ndk;29.0.14206865"

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Tauri CLI
        run: cargo install tauri-cli --version "^2"

      - name: Initialize Android project
        working-directory: source/extracted
        run: |
          rm -rf src-tauri/gen/android
          cargo tauri android init

      - name: Build APK
        working-directory: source/extracted
        run: |
          cargo tauri android build --apk --target aarch64

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: arnis-android-apk
          path: source/extracted/src-tauri/gen/android/app/build/outputs/apk/**/*.apk
